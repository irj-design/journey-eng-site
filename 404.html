<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Journey Engineering">
<meta property="og:description" content="A building is never finished. Design for what comes after.">
<meta property="og:image" content="https://journey-eng.com/assets/og-image.jpg">
<meta name="theme-color" content="#095256">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Not found | Journey Engineering</title>
<meta name="description" content="A building is never finished. HVAC, plumbing, energy code compliance and commissioning on the Central Coast and Central Valley, California.">
<style>
@font-face{font-family:"Outfit";src:url(assets/Outfit-Light.ttf) format("truetype");font-weight:300;font-display:swap}
@font-face{font-family:"Outfit";src:url(assets/Outfit-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Outfit";src:url(assets/Outfit-Medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"Outfit";src:url(assets/Outfit-SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
/* Layout: a drawing set. Each statement is a sheet (M0.0 to M5.0) on a Midnight ground, hairline borders, a live title block. */
:root{
  --ground:#095256; --ground-deep:#063b3e; --ink:#f5dfbb; --muted:#a9c3bf; --line:#1c6a6e; --accent:#e09f3e;
  --sans:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
a{color:inherit}
.nw{white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.frame{max-width:1280px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:28px}
.top img{width:132px;height:auto;display:block}
.top a.mail{font-size:14px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--muted)}
.top a.mail:hover{color:var(--ink)}

/* sheets */
.sheet{border-top:1px solid var(--line);padding-block:clamp(88px,16vh,180px);display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,5fr);gap:32px;position:relative}
@media (max-width:760px){.sheet{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:72px}}
.tag{font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);padding-top:14px;font-variant-numeric:tabular-nums}
.tag b{display:block;color:var(--accent);font-weight:500;letter-spacing:.18em;margin-bottom:6px}
.big{margin:0;font-weight:300;font-size:clamp(40px,7.2vw,104px);line-height:1.02;letter-spacing:-.025em;text-wrap:balance}
.big strong{font-weight:600;color:var(--accent)}
.big .soft{display:block}
.note{margin:36px 0 0;max-width:46ch;font-size:clamp(17px,1.5vw,20px);line-height:1.6;color:var(--muted);font-weight:300}

/* cover */
.cover{border-top:0;padding-top:clamp(64px,12vh,140px)}
.air{position:relative;height:64px;margin-top:64px;overflow:hidden}
.air i{position:absolute;right:0;height:2px;border-radius:2px;background:var(--ink);opacity:.55;animation:drift 9s ease-in-out infinite}
.air i:nth-child(1){top:6px;width:18%;animation-delay:0s}
.air i:nth-child(2){top:20px;width:31%;animation-delay:.6s}
.air i:nth-child(3){top:34px;width:47%;animation-delay:1.2s}
.air i:nth-child(4){top:48px;width:66%;animation-delay:1.8s}
@keyframes drift{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(-4%);opacity:.25}}
@media (prefers-reduced-motion:reduce){.air i{animation:none}html{scroll-behavior:auto}}

/* scope */
.scope{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.scope li{font-size:clamp(34px,5.4vw,76px);line-height:1.08;letter-spacing:-.02em;font-weight:300}
.scope li:nth-child(odd){font-weight:600}
.fine{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px 28px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* index of work */
details{margin-top:48px;border-top:1px solid var(--line);padding-top:20px;max-width:900px}
summary{cursor:pointer;list-style:none;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:" +";color:var(--accent)}
details[open] summary::after{content:" \2212"}
.index{margin:20px 0 0;font-size:16px;line-height:1.9;color:var(--muted)}
.index span{color:var(--ink)}

/* contact */
.contact a{display:block;text-decoration:none;font-size:clamp(28px,4.4vw,60px);line-height:1.15;letter-spacing:-.02em;font-weight:300;width:fit-content;border-bottom:1px solid transparent}
.contact a:hover{border-bottom-color:var(--accent)}
.contact a + a{margin-top:8px}

/* title block */
.titleblock{border-top:1px solid var(--line);margin-top:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.titleblock div{padding:18px 16px 28px 0;border-right:1px solid var(--line);margin-right:16px}
.titleblock div:last-child{border-right:0}
.titleblock b{display:block;color:var(--ink);font-weight:500;margin-top:6px;letter-spacing:.12em}
@media (max-width:760px){.titleblock{grid-template-columns:repeat(2,minmax(0,1fr))}.titleblock div{border-right:0}}

/* live sheet number */
.sheetno{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--ground-deep);border:1px solid var(--line);padding:10px 14px;font-variant-numeric:tabular-nums;z-index:5}
.sheetno b{color:var(--accent);font-weight:600}
@media (max-width:760px){.sheetno{display:none}}
</style>

</head>
<body><div class="frame"><header class="top"><a href="/"><img src="assets/logo-nav.png" width="440" height="178" alt="Journey Engineering"></a></header><section class="sheet" style="border-top:1px solid var(--line)"><div class="tag"><b>404</b>Superseded</div><div><h1 class="big"><span class="soft">This sheet</span><strong>has been superseded.</strong></h1><p class="note"><a href="/">Return to the cover.</a></p></div></section></div></body>
</html>
